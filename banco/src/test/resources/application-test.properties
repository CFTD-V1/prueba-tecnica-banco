# Perfil usado unicamente por las pruebas automaticas.
# Con H2 en memoria la suite corre sin necesidad de levantar el contenedor de PostgreSQL.
spring.datasource.url=jdbc:h2:mem:banco_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
