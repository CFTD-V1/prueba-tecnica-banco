spring.application.name=banco

# --- Conexion a PostgreSQL (el contenedor Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/banco_db
spring.datasource.username=banco_user
spring.datasource.password=banco_pass

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desactivamos Open Session In View: el adaptador convierte las entidades a
# objetos de dominio, asi que no hace falta mantener la sesion abierta.
spring.jpa.open-in-view=false