spring.application.name=banco

# --- Conexion a PostgreSQL (el contenedor Docker) ---
# Los valores se pueden sobrescribir con variables de entorno; los de por defecto
# son los mismos del docker-compose.yml para que funcione recien clonado el repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_db}
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_pass}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Desactivamos Open Session In View: el adaptador convierte las entidades a
# objetos de dominio, asi que no hace falta mantener la sesion abierta.
spring.jpa.open-in-view=false
